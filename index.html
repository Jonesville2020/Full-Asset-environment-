<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Editable floor plan and asset inventory. Search people, rooms and assets and see where they are.">
    <link rel="icon" href="data:,">
    <title>Building Assets &amp; Floor Plan</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <h1>Assets &amp; Floor Plan</h1>

      <div class="search">
        <input id="global-search" type="search" autocomplete="off"
          placeholder="Search a person, room, cube, or asset tag…" aria-label="Search">
        <ul id="search-results" class="search-results" hidden></ul>
      </div>

      <div class="actions">
        <button id="edit-toggle" type="button" aria-pressed="false">Edit mode: off</button>
        <button id="export-json" type="button" title="Download all edits as a JSON file">Export</button>
        <label class="button" title="Load edits from an exported JSON file">
          Import <input id="import-json" type="file" accept="application/json" hidden>
        </label>
        <button id="reset-data" type="button" class="danger edit-only" title="Discard all edits made in this browser">Reset</button>
      </div>
    </header>

    <p id="status" class="status" role="status"></p>

    <main class="workspace">
      <section class="map-panel" aria-label="Floor plan">
        <div class="map-toolbar">
          <div class="zoom">
            <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
            <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
            <button id="zoom-fit" type="button">Fit</button>
            <button id="expand-map" type="button" aria-pressed="false">Expand map</button>
          </div>
          <label class="text-size">Label size
            <input id="text-scale" type="range" min="0.5" max="2" step="0.1" value="0.7">
          </label>
          <button id="layout-toggle" type="button" aria-pressed="false">Layout edit: off</button>
          <label class="paper-size">Map paper size
            <select id="map-paper-size">
              <option value="17x11">11 × 17 in</option>
              <option value="24x18">18 × 24 in</option>
              <option value="36x24">24 × 36 in</option>
            </select>
          </label>
          <button id="print-map" type="button" disabled>Print map / PDF</button>
          <button id="export-svg" type="button" title="Export editable traced paths and labels as SVG">Export SVG</button>
          <label><input id="show-reference" type="checkbox"> Original reference</label>
          <div id="layout-tools" class="layout-tools" hidden>
            <label>Tool
              <select id="layout-tool">
                <option value="select">Select / move</option>
                <option value="wall">Draw wall</option>
                <option value="rectangle">Draw cubicle / room</option>
              </select>
            </label>
            <button id="delete-shape" type="button" disabled>Delete selected</button>
            <button id="undo-layout" type="button" disabled>Undo layout edit</button>
          </div>
          <fieldset class="layers">
            <legend>Show</legend>
            <label><input type="checkbox" data-layer="people" checked> People</label>
            <label><input type="checkbox" data-layer="vacant" checked> Vacant</label>
            <label><input type="checkbox" data-layer="seats" checked> Cube/counter IDs</label>
            <label><input type="checkbox" data-layer="rooms" checked> Rooms</label>
            <label><input type="checkbox" data-layer="printers" checked> Printers</label>
            <label><input type="checkbox" data-layer="aps" checked> Access points</label>
            <label><input type="checkbox" data-layer="other" checked> Other</label>
          </fieldset>
          <div class="add-item edit-only">
            <select id="add-kind" aria-label="New label type"></select>
            <button id="add-item" type="button">Add to map</button>
          </div>
        </div>
        <div class="map-wrap">
          <svg id="map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1224 792" role="img"
            aria-label="Floor plan. Click a name, cube, or room for details.">
            <image id="map-bg" href="data/floorplan.svg" x="0" y="0" width="1224" height="792" hidden/>
            <g id="map-geometry"></g>
            <g id="note-masks" aria-hidden="true"></g>
            <g id="map-items"></g>
            <path id="drawing-preview" hidden></path>
            <circle id="ring" class="ring" r="10" hidden></circle>
          </svg>
          <p class="map-hint">Scroll to zoom, drag to pan, click a label for details.<span class="edit-only"> Drag labels to move them.</span><span id="layout-hint" hidden> Layout editing: select and drag a traced fragment, or choose a drawing tool.</span></p>
        </div>
      </section>

      <aside class="sidebar">
        <div class="tabs" role="tablist">
          <button id="tab-details" type="button" role="tab" aria-selected="true" data-tab="details">Details</button>
          <button id="tab-assets" type="button" role="tab" aria-selected="false" data-tab="assets">Assets</button>
        </div>

        <section id="panel-details" class="tab-panel" role="tabpanel"></section>

        <section id="panel-assets" class="tab-panel" role="tabpanel" hidden>
          <div class="asset-filters">
            <input id="asset-search" type="search" placeholder="Search tag, type, person…" aria-label="Search assets">
            <select id="asset-type-filter" aria-label="Filter by type"></select>
            <select id="asset-status-filter" aria-label="Filter by status">
              <option value="">Everything</option>
              <option value="assigned">Assigned to a person/seat</option>
              <option value="storage">In storage</option>
              <option value="unassigned">Unassigned</option>
            </select>
          </div>
          <div class="asset-bar">
            <span id="asset-count"></span>
            <button id="add-asset" type="button" disabled>Add asset</button>
            <button id="export-csv" type="button">Export CSV</button>
          </div>
          <form id="asset-form" class="asset-form" hidden>
            <h2 id="asset-form-title">Add asset</h2>
            <p class="muted">Changes save only in this browser. Use Export to back them up.</p>
            <label>Asset tag <input id="asset-form-tag" required autocomplete="off"></label>
            <label>Asset type <input id="asset-form-type" list="type-options" required autocomplete="off" placeholder="e.g. Laptop or Monitor"></label>
            <label>Assignment
              <select id="asset-form-status">
                <option value="unassigned">Unassigned</option>
                <option value="assigned">Employee, room or seat</option>
                <option value="storage">Storage</option>
              </select>
            </label>
            <label id="asset-form-assignee-label" hidden>Assigned to
              <input id="asset-form-assignee" list="assignee-options" autocomplete="off" placeholder="Enter an employee, room or seat">
            </label>
            <label>Recorded location <input id="asset-form-location" autocomplete="off" placeholder="Optional, e.g. Tech Storage 1171A"></label>
            <label>Model <input id="asset-form-model" autocomplete="off"></label>
            <label>Serial number <input id="asset-form-serial" autocomplete="off"></label>
            <p id="asset-form-error" class="asset-form-error" role="alert" hidden></p>
            <div class="form-actions">
              <button type="submit">Save asset</button>
              <button id="cancel-asset" type="button">Cancel</button>
            </div>
          </form>
          <div class="report-actions">
            <button id="report-assigned" type="button" disabled>Assigned asset report</button>
            <button id="report-unassigned" type="button" disabled>Unassigned / storage report</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th><button type="button" data-sort="tag">Tag</button></th>
                  <th><button type="button" data-sort="type">Type</button></th>
                  <th><button type="button" data-sort="assignee">Assigned to</button></th>
                  <th scope="col">Actions</th>
                </tr>
              </thead>
              <tbody id="asset-rows"></tbody>
            </table>
          </div>
          <button id="more-assets" type="button" hidden>Show more</button>
        </section>
      </aside>
    </main>

    <datalist id="type-options"></datalist>
    <datalist id="assignee-options"></datalist>
  </body>
</html>
