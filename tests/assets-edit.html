<!doctype html>
<meta charset="utf-8">
<title>Asset editing browser checks</title>
<pre id="result">Running…</pre>
<iframe id="app" src="../index.html" style="width: 1200px; height: 800px"></iframe>
<script>
  const frame = document.querySelector("#app");
  const result = document.querySelector("#result");
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const loaded = () => new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  async function ready() {
    for (let i = 0; i < 100; i += 1) {
      if (!frame.contentDocument.querySelector("#add-asset")?.disabled) return;
      await wait(50);
    }
    throw new Error("App did not load");
  }
  function value(doc, id, text) {
    doc.querySelector(id).value = text;
    doc.querySelector(id).dispatchEvent(new Event("change", { bubbles: true }));
  }
  function submit(doc) {
    doc.querySelector("#asset-form").dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
  }
  async function run() {
    await loaded();
    await ready();
    let doc = frame.contentDocument;
    const app = frame.contentWindow;
    app.print = () => {};
    doc.querySelector("#tab-assets").click();
    doc.querySelector("#add-asset").click();
    submit(doc);
    assert(!doc.querySelector("#asset-form-error").hidden, "Missing fields were not reported");
    value(doc, "#asset-form-tag", "NEW-TEST-01");
    value(doc, "#asset-form-type", "Laptop");
    value(doc, "#asset-form-status", "assigned");
    submit(doc);
    assert(!doc.querySelector("#asset-form-error").hidden, "Missing employee was not reported");
    value(doc, "#asset-form-assignee", "Doug Petty 01");
    value(doc, "#asset-form-serial", "SERIAL-TEST");
    submit(doc);
    let saved = JSON.parse(localStorage.getItem("full-asset-environment.v1"));
    let added = saved.assets.find((asset) => asset.tag === "NEW-TEST-01");
    assert(added && added.assignee === "Doug Petty" && added.serial === "SERIAL-TEST", "New employee assignment was not saved");
    assert(doc.querySelector("#asset-rows").textContent.includes("Doug Petty"), "Added asset not visible");

    doc.querySelector('[aria-label="Edit NEW-TEST-01"]').click();
    value(doc, "#asset-form-status", "storage");
    value(doc, "#asset-form-location", "Tech Storage 1171A");
    submit(doc);
    saved = JSON.parse(localStorage.getItem("full-asset-environment.v1"));
    added = saved.assets.find((asset) => asset.tag === "NEW-TEST-01");
    assert(added.assignee === "Storage" && added.location === "Tech Storage 1171A", "Storage update was not saved");
    doc.querySelector("#report-unassigned").click();
    assert(doc.querySelector("#print-root").textContent.includes("NEW-TEST-01"), "Storage report omitted updated asset");

    doc.querySelector('[aria-label="Edit NEW-TEST-01"]').click();
    value(doc, "#asset-form-status", "assigned");
    value(doc, "#asset-form-assignee", "Doug Petty");
    submit(doc);
    doc.querySelector("#report-assigned").click();
    assert(doc.querySelector("#print-root").textContent.includes("NEW-TEST-01"), "Assigned report omitted updated asset");
    const reload = loaded();
    app.location.reload();
    await reload;
    await ready();
    doc = frame.contentDocument;
    const input = doc.querySelector("#global-search");
    input.value = "Doug Petty";
    input.dispatchEvent(new Event("input"));
    const match = [...doc.querySelectorAll("#search-results li")].find((item) => item.firstChild.textContent === "Doug Petty 01");
    assert(match, "Employee map result missing");
    match.dispatchEvent(new MouseEvent("mousedown", { bubbles: true }));
    assert(doc.querySelector("#panel-details").textContent.includes("NEW-TEST-01"), "Saved asset is not linked to employee on the map");
    doc.querySelector("#tab-assets").click();
    doc.querySelector("#add-asset").click();
    value(doc, "#asset-form-tag", "CANCELLED-TEST");
    doc.querySelector("#cancel-asset").click();
    assert(!JSON.parse(localStorage.getItem("full-asset-environment.v1")).assets.some((asset) => asset.tag === "CANCELLED-TEST"), "Cancelled asset was saved");
    const first = JSON.parse(localStorage.getItem("full-asset-environment.v1")).assets.find((asset) => asset.id === "a1");
    value(doc, "#asset-search", first.tag);
    doc.querySelector("#asset-search").dispatchEvent(new Event("input", { bubbles: true }));
    doc.querySelector(`[aria-label="Edit ${first.tag}"]`).click();
    value(doc, "#asset-form-status", "assigned");
    value(doc, "#asset-form-assignee", "Danny Tinsman");
    submit(doc);
    saved = JSON.parse(localStorage.getItem("full-asset-environment.v1"));
    assert(saved.assets.find((asset) => asset.id === first.id).assignee === "Danny Tinsman", "Existing asset could not be reassigned");
    assert(saved.assets.find((asset) => asset.id === first.id).model === first.model, "Editing lost existing model data");
    localStorage.removeItem("full-asset-environment.v1");
    result.textContent = "PASS";
  }
  run().catch((error) => { result.textContent = `FAIL: ${error.message}`; });
</script>
