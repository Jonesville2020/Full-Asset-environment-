<!doctype html>
<meta charset="utf-8">
<title>Print and report browser checks</title>
<pre id="result">Running…</pre>
<iframe id="app" src="../index.html" style="width: 1200px; height: 800px"></iframe>
<script>
  const frame = document.querySelector("#app");
  const result = document.querySelector("#result");
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const loaded = () => new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  async function ready() {
    for (let i = 0; i < 100; i += 1) {
      if (frame.contentDocument.querySelector("#map-geometry path")) return;
      await wait(50);
    }
    throw new Error("App did not load");
  }
  async function run() {
    await loaded();
    await ready();
    const app = frame.contentWindow;
    let doc = frame.contentDocument;
    const source = JSON.parse(localStorage.getItem("full-asset-environment.v1") || "null");
    const data = source || {
      version: 3,
      items: await fetch("../data/floorplan.json").then((response) => response.json()).then((plan) => plan.items),
      geometry: await fetch("../data/floorplan-geometry.json").then((response) => response.json()),
    };
    const asset = (id, tag, type, assignee, location = "") =>
      ({ id, tag, type, assignee, location, model: "", serial: "" });
    data.assets = [
      asset("1", "002", "Monitor", "Zoe"),
      asset("2", "020", "Monitor", "Amy"),
      asset("3", "010", "Monitor", "Amy"),
      asset("4", "100", "Laptop", "Amy"),
      asset("5", "003", "Tablet", ""),
      asset("6", "004", "Laptop", "Storage", "Tech Storage"),
      asset("7", "005", "Laptop", "Counter 1"),
    ];
    data.items.push({ id: "print-test", k: "person", t: "Edited printable name", x: 1300, y: 200, s: 5, r: 0, loc: "" });
    data.geometry.push({ id: "print-wall", kind: "wall", d: "M0 0L30 0", x: 1350, y: 250 });
    localStorage.setItem("full-asset-environment.v1", JSON.stringify(data));
    const reload = loaded();
    app.location.reload();
    await reload;
    await ready();
    doc = frame.contentDocument;
    app.print = () => {};
    doc.querySelector("#asset-search").value = "not in inventory";
    doc.querySelector("#asset-search").dispatchEvent(new Event("input"));

    doc.querySelector("#report-assigned").click();
    let root = doc.querySelector("#print-root");
    let groups = [...root.querySelectorAll(".report-group")];
    assert(groups.map((group) => group.querySelector("h2").textContent).join("|") === "Amy (3)|Counter 1 (1)|Zoe (1)", "Assigned groups are incomplete or not alphabetical");
    const rows = [...groups[0].querySelectorAll("tbody tr")].map((row) => row.textContent);
    assert(rows.join("|") === "Laptop100|Monitor010|Monitor020", "Assets are not sorted by type then tag");
    assert(!root.textContent.includes("Storage") && !root.textContent.includes("Tablet"), "Unassigned or storage included in assigned report");
    assert(doc.querySelector("#print-page-style").textContent.includes("portrait"), "Report is not portrait");

    doc.querySelector("#report-unassigned").click();
    root = doc.querySelector("#print-root");
    const unassigned = [...root.querySelectorAll("tbody tr")].map((row) => row.textContent);
    assert(unassigned.length === 2 && unassigned[0].includes("Storage") && unassigned[0].includes("Tech Storage") && unassigned[1].includes("Unassigned"), "Unassigned report omitted storage or location");
    assert(root.textContent.includes("2 assets"), "Report applied on-screen filters");

    const people = doc.querySelector('[data-layer="people"]');
    people.click();
    doc.querySelector("#print-map").click();
    root = doc.querySelector("#print-root");
    const svg = root.querySelector("svg");
    assert([...svg.querySelectorAll("text")].some((text) => text.textContent === "Edited printable name"), "Print omitted hidden or edited labels");
    assert([...svg.querySelectorAll("path")].some((path) => path.getAttribute("transform") === "translate(1350 250)"), "Print omitted edited geometry");
    const box = svg.getAttribute("viewBox").split(" ").map(Number);
    assert(box[0] + box[2] >= 1380, "Print map clipped geometry outside the original bounds");
    assert(doc.querySelector("#print-page-style").textContent.includes("17in 11in"), "Default map size is not 11 by 17 inches");
    assert(!root.querySelector("#ring") && !root.querySelector("image"), "Print included selection or reference image");
    for (const [value, expected] of [["24x18", "24in 18in"], ["36x24", "36in 24in"]]) {
      doc.querySelector("#map-paper-size").value = value;
      doc.querySelector("#print-map").click();
      assert(doc.querySelector("#print-page-style").textContent.includes(expected), `Map size ${value} not applied`);
    }
    localStorage.removeItem("full-asset-environment.v1");
    result.textContent = "PASS";
  }
  run().catch((error) => { result.textContent = `FAIL: ${error.message}`; });
</script>
