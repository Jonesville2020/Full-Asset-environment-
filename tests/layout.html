<!doctype html>
<meta charset="utf-8">
<title>Editable layout browser checks</title>
<pre id="result">Running…</pre>
<iframe id="app" src="../index.html" style="width: 1200px; height: 800px"></iframe>
<script>
  const result = document.querySelector("#result");
  const frame = document.querySelector("#app");
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const loaded = () => new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  async function ready() {
    for (let i = 0; i < 100; i += 1) {
      if (frame.contentDocument.querySelector("#map-geometry path")) return;
      await wait(50);
    }
    throw new Error("Geometry did not load");
  }
  function pointer(target, type, x, y) {
    target.dispatchEvent(new PointerEvent(type, { bubbles: true, button: 0, pointerId: 1, clientX: x, clientY: y }));
  }
  async function run() {
    await loaded();
    await ready();
    let doc = frame.contentDocument;
    let map = doc.querySelector("#map");
    map.setPointerCapture = () => {};
    const originalCount = doc.querySelectorAll("#map-geometry path").length;
    assert(originalCount > 500, "Trace fragments missing");
    doc.querySelector("#expand-map").click();
    assert(doc.querySelector(".workspace").classList.contains("expanded"), "Map did not expand");
    doc.querySelector("#show-reference").click();
    assert(!doc.querySelector("#map-bg").hasAttribute("hidden"), "Reference did not turn on");
    doc.querySelector("#layout-toggle").click();
    assert(map.classList.contains("layout-edit"), "Layout edit did not turn on");

    doc.querySelector("#layout-tool").value = "wall";
    pointer(map, "pointerdown", 300, 300);
    pointer(map, "pointermove", 350, 330);
    pointer(map, "pointerup", 350, 330);
    assert(doc.querySelectorAll("#map-geometry path").length === originalCount + 1, "Wall was not added");
    assert(!doc.querySelector("#undo-layout").disabled, "Undo was not enabled");
    await wait(350);
    let saved = JSON.parse(localStorage.getItem("full-asset-environment.v1"));
    let wall = saved.geometry.find((shape) => shape.kind === "wall");
    assert(wall && wall.d.includes("L"), "Wall was not saved");

    doc.querySelector("#layout-tool").value = "select";
    const wallNode = doc.querySelector(`[data-id="${wall.id}"]`);
    pointer(wallNode, "pointerdown", 300, 300);
    pointer(map, "pointermove", 330, 300);
    pointer(map, "pointerup", 330, 300);
    await wait(350);
    saved = JSON.parse(localStorage.getItem("full-asset-environment.v1"));
    wall = saved.geometry.find((shape) => shape.kind === "wall");
    assert(wall.x !== 0, "Wall did not move");
    doc.querySelector("#undo-layout").click();
    await wait(350);
    saved = JSON.parse(localStorage.getItem("full-asset-environment.v1"));
    assert(saved.geometry.find((shape) => shape.kind === "wall").x === 0, "Undo did not restore wall position");

    doc.querySelector("#layout-tool").value = "rectangle";
    pointer(map, "pointerdown", 300, 300);
    pointer(map, "pointermove", 350, 330);
    pointer(map, "pointerup", 350, 330);
    assert(doc.querySelectorAll("#map-geometry path").length === originalCount + 2, "Cubicle was not added");
    doc.querySelector("#delete-shape").click();
    assert(doc.querySelectorAll("#map-geometry path").length === originalCount + 1, "Selected cubicle was not deleted");
    await wait(350);

    const reload = loaded();
    frame.contentWindow.location.reload();
    await reload;
    await ready();
    doc = frame.contentDocument;
    assert(doc.querySelectorAll("#map-geometry path").length === originalCount + 1, "Wall did not survive reload");
    const appWindow = frame.contentWindow;
    let exported;
    appWindow.URL.createObjectURL = (blob) => { exported = blob; return "blob:test"; };
    appWindow.URL.revokeObjectURL = () => {};
    appWindow.HTMLAnchorElement.prototype.click = () => {};
    doc.querySelector("#export-svg").click();
    assert(exported, "SVG was not exported");
    const content = await exported.text();
    const parsed = new DOMParser().parseFromString(content, "image/svg+xml");
    assert(!parsed.querySelector("parsererror"), "SVG is malformed");
    assert(parsed.querySelectorAll("path").length === originalCount + 1, "SVG does not contain editable geometry");
    assert(parsed.querySelectorAll("text").length > 100, "SVG does not contain labels");
    assert(!parsed.querySelector("image"), "SVG unexpectedly contains a flattened image");
    localStorage.removeItem("full-asset-environment.v1");
    result.textContent = "PASS";
  }
  run().catch((error) => { result.textContent = `FAIL: ${error.message}`; });
</script>
