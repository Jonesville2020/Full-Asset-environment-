<!doctype html>
<meta charset="utf-8">
<title>Bullpen and notes browser checks</title>
<pre id="result">Running…</pre>
<iframe id="app" src="../index.html" style="width: 1200px; height: 850px"></iframe>
<script>
  const result = document.querySelector("#result");
  const frame = document.querySelector("#app");
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const loaded = () => new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  async function ready() {
    for (let i = 0; i < 100; i += 1) {
      if (frame.contentDocument.querySelector("#map-geometry path")) return;
      await wait(50);
    }
    throw new Error("App did not load");
  }
  function search(doc, value, exact) {
    const input = doc.querySelector("#global-search");
    input.value = value;
    input.dispatchEvent(new Event("input"));
    const match = [...doc.querySelectorAll("#search-results li")].find((item) =>
      item.firstChild.textContent === exact,
    );
    assert(match, `Missing search result: ${exact}`);
    match.dispatchEvent(new MouseEvent("mousedown", { bubbles: true }));
  }
  async function run() {
    const initialLoad = loaded();
    const [plan, assets, geometry] = await Promise.all([
      fetch("../data/floorplan.json").then((response) => response.json()),
      fetch("../data/assets.json").then((response) => response.json()),
      fetch("../data/floorplan-geometry.json").then((response) => response.json()),
    ]);
    await initialLoad;
    await ready();
    const linked = plan.items.filter((item) => /^BP-\d\d$/.test(item.loc || ""));
    assert(linked.length === 26, "Expected 26 BP links");
    for (let number = 1; number <= 26; number += 1) {
      const location = `BP-${String(number).padStart(2, "0")}`;
      assert(linked.filter((item) => item.loc === location).length === 1, `Missing ${location} occupant`);
    }
    const note = plan.items.find((item) => item.t === "NEW BOILER");
    assert(note?.k === "note" && plan.noteMasks.length >= 30, "Editable notes missing");

    const oldItems = plan.items.filter((item) => item.k !== "note").map((item) =>
      item.loc?.startsWith("BP-") ? { ...item, loc: "" } : item,
    );
    oldItems[0].t = "User-edited label";
    geometry[0].x = 42;
    localStorage.setItem("full-asset-environment.v1", JSON.stringify({ version: 2, items: oldItems, assets, geometry }));
    const reload = loaded();
    frame.contentWindow.location.reload();
    await reload;
    await ready();
    const doc = frame.contentDocument;
    const saved = JSON.parse(localStorage.getItem("full-asset-environment.v1"));
    assert(saved.version === 3 && saved.items[0].t === "User-edited label", "Existing edits were not preserved");
    assert(saved.geometry[0].x === 42, "Existing layout edits were not preserved");
    assert(saved.items.filter((item) => item.loc?.startsWith("BP-")).length === 26, "Existing data did not receive BP links");
    assert(saved.items.some((item) => item.t === "NEW BOILER" && item.k === "note"), "Existing data did not receive notes");

    search(doc, "Doug Petty", "Doug Petty 01");
    const seat = plan.items.find((item) => item.t === "BP-01");
    assert(Number(doc.querySelector("#ring").getAttribute("cx")) === seat.x, "Person search did not highlight the BP seat");
    assert(doc.querySelector("#panel-details").textContent.includes("BP-01"), "Person location missing");
    const seatAsset = assets.find((asset) => asset.assignee === "Bullpen 1");
    assert(seatAsset && doc.querySelector("#panel-details").textContent.includes(seatAsset.tag), "Person is missing their seat's asset");
    search(doc, "BP-01", "BP-01");
    let details = doc.querySelector("#panel-details").textContent;
    assert(details.includes("Doug Petty") && details.includes("Assets here"), "BP seat did not show its person and assets");
    search(doc, "BP-07", "BP-07");
    details = doc.querySelector("#panel-details").textContent;
    assert(details.includes("Vacant 07"), "Vacant BP seat did not show the vacancy");
    assert(doc.querySelector("#note-masks rect") && [...doc.querySelectorAll(".k-note text")].some((text) => text.textContent === "NEW BOILER"), "Notes are not rendered as text");
    let exported;
    frame.contentWindow.URL.createObjectURL = (blob) => { exported = blob; return "blob:test"; };
    frame.contentWindow.URL.revokeObjectURL = () => {};
    frame.contentWindow.HTMLAnchorElement.prototype.click = () => {};
    doc.querySelector("#export-svg").click();
    const svg = new DOMParser().parseFromString(await exported.text(), "image/svg+xml");
    assert([...svg.querySelectorAll("text")].some((text) => text.textContent === "NEW BOILER"), "SVG did not export note text");
    assert(svg.querySelector("rect"), "SVG did not export note masks");
    frame.contentWindow.eval("view = { x: 380, y: 295, w: 165, h: 185 }; applyView();");
    localStorage.removeItem("full-asset-environment.v1");
    result.textContent = "PASS";
  }
  run().catch((error) => { result.textContent = `FAIL: ${error.message}`; });
</script>
